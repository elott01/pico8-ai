name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      # Node strips types without checking them, so the suite passes either way — this is
      # the only thing standing between a type error and main.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
