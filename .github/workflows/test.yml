name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Fast checks: no browsers, no server, ~30s. Kept as its own job so a browser download
  # never delays the signal on a type error.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      # Node strips types without checking them, so the suite passes either way — this is
      # the only thing standing between a type error and main.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Browser suite. Runs in parallel with `unit` rather than after it: the two fail for
  # unrelated reasons, and waiting would only delay whichever signal you actually needed.
  #
  # One job per project, each on its own runner. In one job the four projects shared two
  # workers on a 4-core runner and ran one after another, which took over 20 minutes; split,
  # they run side by side, and a failure names its engine. `browser` is what the project
  # launches: mobile-safari is WebKit with an iPhone's viewport and touch.
  #
  # WebKit runs on macOS. Linux has a WebKit too, but it's a different port that no Safari user
  # runs, and on a Linux runner it ran PICO-8 about ten times slower than real time: a cart
  # took 12s to boot, and every test that waits for frames timed out. On macOS it's the WebKit
  # Safari is built on, and the one this suite already passes in locally.
  browsers:
    name: playwright (${{ matrix.project }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One engine failing says nothing about the others, so let them finish.
      fail-fast: false
      matrix:
        include:
          - { project: chromium, browser: chromium, os: ubuntu-latest }
          - { project: webkit, browser: webkit, os: macos-latest }
          - { project: mobile-safari, browser: webkit, os: macos-latest }
          - { project: firefox, browser: firefox, os: ubuntu-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci

      # Browsers are ~200MB (WebKit is most of it), so they are cached against the exact
      # Playwright version — a stale browser for a newer runner is a confusing failure.
      # Keyed by browser too, since each job installs only its own.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # Playwright keeps browsers in a different folder on each OS. Only one exists on a runner,
      # and the cache takes whichever it finds.
      - uses: actions/cache@v4
        id: browsers
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ matrix.browser }}

      # WebKit is the reason this suite exists: the cart switcher was keyboard-unreachable in
      # Safari while passing every Chromium check. Dropping it to save a minute would put
      # the suite back to being unable to catch the bug it was written for.
      #
      # Every project in playwright.config.ts needs its browser here. Firefox was added to the
      # config without one, and each of its tests failed at launch, in a millisecond.
      - name: Install browser
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install ${{ matrix.browser }}

      # The system libraries the browser links against. Linux only: macOS has them already. The
      # cache restores the browser but not these, so they're installed on every run.
      - name: Install browser system deps
        if: runner.os == 'Linux'
        run: npx playwright install-deps ${{ matrix.browser }}

      # A Linux runner has no sound card, so Firefox's audio never plays, and volume.spec hears
      # silence at every level. A PulseAudio server with no hardware gives it a silent output
      # that still runs. Chromium needs none, having a fake output of its own when headless.
      - name: Give Firefox somewhere to play sound
        if: matrix.browser == 'firefox'
        run: |
          sudo apt-get install -y --no-install-recommends pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=silent
          pactl set-default-sink silent

      # Starts Vite itself (see playwright.config.ts). No GEMINI_API_KEY, no quota:
      # /api/move is stubbed in-page for the one test that needs a model response.
      - run: npm run test:playwright -- --project=${{ matrix.project }}

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7

  # The check main's branch rule requires, by this name. It stands for the four jobs above, so the
  # rule doesn't have to list them and stays right when a project is added or dropped. Without it
  # the rule waited for a `playwright` check that the split had stopped reporting.
  #
  # `always()`, because a job skipped after a failure counts as passing for a required check, and
  # the result is checked by hand for the same reason.
  playwright:
    needs: browsers
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every project passed
        run: test "${{ needs.browsers.result }}" = success
