name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Fast checks: no browsers, no server, ~30s. Kept as its own job so a browser download
  # never delays the signal on a type error.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      # Node strips types without checking them, so the suite passes either way — this is
      # the only thing standing between a type error and main.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Browser suite. Runs in parallel with `unit` rather than after it: the two fail for
  # unrelated reasons, and waiting would only delay whichever signal you actually needed.
  #
  # One job per project, each on its own runner. In one job the four projects shared two
  # workers on a 4-core runner and ran one after another, which took over 20 minutes; split,
  # they run side by side, and a failure names its engine. `browser` is what the project
  # launches: mobile-safari is WebKit with an iPhone's viewport and touch.
  playwright:
    name: playwright (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      # One engine failing says nothing about the others, so let them finish.
      fail-fast: false
      matrix:
        include:
          - { project: chromium, browser: chromium }
          - { project: webkit, browser: webkit }
          - { project: mobile-safari, browser: webkit }
          - { project: firefox, browser: firefox }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci

      # Browsers are ~200MB (WebKit is most of it), so they are cached against the exact
      # Playwright version — a stale browser for a newer runner is a confusing failure.
      # Keyed by browser too, since each job installs only its own.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ matrix.browser }}

      # WebKit is the reason this suite exists: the cart switcher was keyboard-unreachable in
      # Safari while passing every Chromium check. Dropping it to save a minute would put
      # the suite back to being unable to catch the bug it was written for.
      #
      # Every project in playwright.config.ts needs its browser here. Firefox was added to the
      # config without one, and each of its tests failed at launch, in a millisecond.
      - name: Install browser
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.browser }}

      # The cache restores binaries but not the system libraries they link against.
      - name: Install browser system deps
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.browser }}

      # Starts Vite itself (see playwright.config.ts). No GEMINI_API_KEY, no quota:
      # /api/move is stubbed in-page for the one test that needs a model response.
      - run: npm run test:playwright -- --project=${{ matrix.project }}

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7
